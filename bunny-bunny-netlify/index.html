<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="bunny机">
  <meta name="description" content="bunny bunny：黑白简约韩系风格的 AI 虚拟小手机。">
  <title>bunny bunny</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/splash.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/shell.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/apps/desktop.css">
  <link rel="stylesheet" href="./css/apps/chat.css">
  <link rel="stylesheet" href="./css/apps/settings.css">
  <link rel="stylesheet" href="./css/apps/social.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/enhancements.css">
  <link rel="stylesheet" href="./css/ios-refinement.css">
  <link rel="stylesheet" href="./css/chat-v3.css">
  <link rel="stylesheet" href="./css/call-v3.css">
  <link rel="stylesheet" href="./css/contacts-v2.css">
  <link rel="stylesheet" href="./css/desktop-polish.css">
  <link rel="stylesheet" href="./css/x-app.css">
  <link rel="stylesheet" href="./css/device-shell.css">
  <link rel="stylesheet" href="./css/chat-skins.css">
  <link rel="stylesheet" href="./css/chat-refresh.css">
  <link rel="stylesheet" href="./css/chat-bubble-fidelity.css">
  <link rel="stylesheet" href="./css/chat-interactions.css">
  <link rel="stylesheet" href="./css/tiktok-app.css">
</head>
<body>
  <div class="launch-screen" id="launch-screen" role="status" aria-label="bunny bunny 正在启动">
    <div class="launch-content">
      <div class="launch-icon-wrap"><img class="launch-icon" src="./icons/icon.svg" alt=""></div>
      <div class="launch-title">BUNNY BUNNY</div>
      <div class="launch-subtitle">ENTERING YOUR LITTLE WORLD</div>
      <div class="launch-progress" aria-hidden="true"></div>
    </div>
  </div>
  <main class="stage">
    <section class="phone" id="phone-root" aria-label="bunny bunny 虚拟手机">
      <div class="dynamic-island" id="dynamic-island" role="status" aria-live="polite">
        <span class="island-dot"></span><span id="island-copy">bunny 正在陪你</span>
      </div>
      <div class="screen" id="app-screen" data-app="desktop">
        <header class="app-header" id="app-header">
          <button class="icon-button hidden" id="back-button" aria-label="退出当前界面">‹</button>
          <div>
            <span class="eyebrow" id="header-kicker"></span>
            <h2 id="header-title" aria-live="off"></h2>
          </div>
          <button class="icon-button" id="quick-settings" aria-label="完成编辑">完成</button>
        </header>
        <div class="app-view" id="app-view" tabindex="-1"></div>
        <nav class="home-indicator-wrap" aria-label="系统导航">
          <button class="home-indicator" id="home-button" aria-label="退出当前界面并返回桌面"></button>
        </nav>
      </div>
      <div class="modal-root" id="modal-root" aria-live="polite"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
