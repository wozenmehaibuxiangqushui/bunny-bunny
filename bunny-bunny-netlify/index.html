<body>
<main class="shell">
<aside class="side brand"><span class="eyebrow">BUNNY OS · 2.0 PROTOTYPE</span><h1>bunny<br>bunny</h1><p>一台装得下角色生活与共同世界的小手机。黑白韩系，轻盈、安静，也可以像水一样透明。</p><div class="mini"><span>当前世界</span><b>首尔 · 平行日常</b></div></aside>
<section class="phone" id="phone">
<div class="status"><span id="clock">09:41</span><span>●●● ◒</span></div><div class="island">BUNNY · ONLINE</div>
<div class="screen"><header class="topbar"><button class="iconbtn hidden" id="back">‹</button><div><small id="kicker">BUNNY OS</small><h2 id="title">我的小手机</h2></div><button class="iconbtn" id="action">⋯</button></header><div class="view" id="view"></div><div class="homebar" id="homebar"></div></div>
<div class="toast" id="toast"></div>
</section>
<aside class="side note"><span class="eyebrow">DEVICE PREVIEW</span><p>切换设备档位，桌面会按固定网格容量自动分页。手机内的所有设置都会保存在本机。</p><div class="device-picker" id="devices"></div></aside>
</main>
<script>
(function(){
var icons={chat:"◌",contacts:"人",moments:"◎",worldbook:"世",presets:"预",calendar:"14",memos:"记",focus:"25",together:"▷",forum:"文",delivery:"食",shop:"购",flea:"换",sms:"信",phone:"话",wallet:"¥",games:"玩",music:"♫",photos:"▧",weather:"°",browser:"⌁",api:"AI",settings:"＋",data:"DB"};
var names={chat:"聊天",contacts:"联系人",moments:"朋友圈",worldbook:"世界书",presets:"预设",calendar:"日历",memos:"备忘录",focus:"陪伴专注",together:"一起刷",forum:"论坛",delivery:"外卖",shop:"购物",flea:"二手",sms:"短信",phone:"电话",wallet:"钱包",games:"游戏",music:"音乐",photos:"相册",weather:"天气",browser:"浏览器",api:"模型 API",settings:"设置",data:"数据"};
var defaultApps=Object.keys(icons).map(function(id){return{id:id,name:names[id],icon:icons[id],route:["chat","worldbook","settings","data"].indexOf(id)>-1?id:"placeholder"}});
var profiles={compact:{label:"iPhone 15 / 16 前",w:375,h:812,cols:4,rows:4},pro:{label:"iPhone Pro",w:393,h:852,cols:4,rows:5},max:{label:"iPhone Pro Max",w:430,h:900,cols:4,rows:5},android:{label:"Android 大屏",w:412,h:892,cols:5,rows:5}};
var saved={};try{saved=JSON.parse(localStorage.getItem("bunny-v2")||"{}")}catch(e){}
var state=Object.assign({route:"home",device:"pro",theme:"mono",page:0,edit:false,apps:defaultApps,folders:[],group:"all",hideUserAvatar:false,bubble:"imessage",bubbleColor:"#111111",bubbleSize:14,fontUrl:"",worlds:["首尔日常","大学 AU"],css:"",appName:"bunny bunny",bunnyIcon:"线条兔",charCity:"首尔",charProto:"Seoul",userCity:"上海",userProto:"Shanghai",recognize:true,tone:true,voiceSpeed:1,language:"自动",emotion:"自动",backgrounds:[]},saved);
var phone=document.getElementById("phone"),view=document.getElementById("view"),title=document.getElementById("title"),kicker=document.getElementById("kicker"),back=document.getElementById("back"),action=document.getElementById("action");
function persist(){localStorage.setItem("bunny-v2",JSON.stringify(state))}
function toast(s){var t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1500)}
function setHeader(t,k,canBack,act){title.textContent=t;kicker.textContent=k||"BUNNY OS";back.classList.toggle("hidden",!canBack);action.textContent=act||"⋯"}
function svg(type){var d={chat:'<path d="M4 5h16v11H9l-5 4V5z"/>',moments:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/>',me:'<circle cx="12" cy="8" r="3"/><path d="M5 20c1-5 13-5 14 0"/>',group:'<circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c1-5 11-5 12 0M15 16c4 0 6 2 6 4"/>'}[type];return'<svg viewBox="0 0 24 24">'+d+'</svg>'}
function nav(r){state.route=r;state.edit=false;persist();render()}
back.onclick=function(){nav(state.route==="conversation"?"chat":state.route.indexOf("setting-")===0?"settings":"home")};
document.getElementById("homebar").onclick=function(){nav("home")};
function render(){phone.classList.toggle("glass",state.theme==="glass");var r=state.route;if(r==="home")renderHome();else if(r==="chat")renderChats();else if(r==="conversation")renderConversation();else if(r==="settings")renderSettings();else if(r==="setting-appearance")renderAppearance();else if(r==="setting-character")renderCharacter();else if(r==="setting-chat")renderChatSettings();else if(r==="data")renderData();else if(r==="worldbook")renderWorldbook();else renderPlaceholder()}
function appTile(a){var folder=a.folder;return'<button class="app'+(state.edit?' editing':'')+'" draggable="'+state.edit+'" data-id="'+a.id+'"><i class="minus">−</i><span class="app-icon">'+(folder?'<span class="folder-grid"><i></i><i></i><i></i><i></i></span>':a.icon)+'</span><span class="app-name">'+a.name+'</span></button>'}
function renderHome(){setHeader(state.appName,"BUNNY OS",false,state.edit?"完成":"⋯");var p=profiles[state.device],cap=p.cols*p.rows,items=state.apps.concat(state.folders.map(function(f){return{id:f.id,name:f.name,folder:true,icon:"□"}})),pages=[];for(var i=0;i<items.length;i+=cap)pages.push(items.slice(i,i+cap));if(!pages.length)pages=[[]];state.page=Math.min(state.page,pages.length-1);view.innerHTML='<div class="home-head"><div class="home-date"><b>'+String(new Date().getDate()).padStart(2,"0")+'</b><span>'+new Intl.DateTimeFormat("zh-CN",{month:"long",weekday:"short"}).format(new Date())+'</span></div><span class="world-chip">首尔 · 17°C</span></div><div class="pages-viewport"><div class="pages-track" style="transform:translateX(-'+(state.page*100)+'%)">'+pages.map(function(pg,n){return'<div class="desktop-page" data-page="'+n+'">'+pg.map(appTile).join("")+'</div>'}).join("")+'</div></div><div class="dots">'+pages.map(function(_,n){return'<i class="dot '+(n===state.page?'active':'')+'"></i>'}).join("")+'</div>'+(state.edit?'<div class="edit-tip">拖到边缘换页 · 拖到图标上创建文件夹</div>':'')+'<div class="dock">'+["chat","phone","worldbook","settings"].map(function(id){var a=defaultApps.find(function(x){return x.id===id});return appTile(a)}).join("")+'</div>';
action.onclick=function(){state.edit=!state.edit;renderHome()};
var startX=0;view.onpointerdown=function(e){startX=e.clientX};view.onpointerup=function(e){if(state.edit)return;var dx=e.clientX-startX;if(Math.abs(dx)>45){state.page=Math.max(0,Math.min(pages.length-1,state.page+(dx<0?1:-1)));renderHome()}};
var touchDrag="";view.querySelectorAll(".app").forEach(function(el){el.onclick=function(e){if(state.edit)return;var a=state.apps.find(function(x){return x.id===el.dataset.id}),f=state.folders.find(function(x){return x.id===el.dataset.id});if(f)openFolder(f);else if(a)nav(a.route)};el.onpointerdown=function(e){if(state.edit){touchDrag=el.dataset.id;el.classList.add("dragging");el.setPointerCapture&&el.setPointerCapture(e.pointerId)}};el.onpointerup=function(e){if(!state.edit||!touchDrag)return;el.classList.remove("dragging");var rect=phone.getBoundingClientRect(),target=document.elementFromPoint(e.clientX,e.clientY);target=target&&target.closest(".app");if(target&&target.dataset.id!==touchDrag)makeFolder(touchDrag,target.dataset.id);else if(e.clientX<rect.left+45&&state.page>0)movePage(touchDrag,state.page-1,cap);else if(e.clientX>rect.right-45&&state.page<pages.length-1)movePage(touchDrag,state.page+1,cap);touchDrag=""};el.ondragstart=function(e){e.dataTransfer.setData("text",el.dataset.id);el.classList.add("dragging")};el.ondragend=function(e){el.classList.remove("dragging");var rect=phone.getBoundingClientRect();if(e.clientX<rect.left+45&&state.page>0){movePage(el.dataset.id,state.page-1,cap)}else if(e.clientX>rect.right-45&&state.page<pages.length-1){movePage(el.dataset.id,state.page+1,cap)}};el.ondragover=function(e){e.preventDefault()};el.ondrop=function(e){e.preventDefault();var from=e.dataTransfer.getData("text"),to=el.dataset.id;if(from&&to&&from!==to)makeFolder(from,to)}})}
function movePage(id,target,cap){var idx=state.apps.findIndex(function(a){return a.id===id});if(idx<0)return;var a=state.apps.splice(idx,1)[0];state.apps.splice(Math.min(target*cap,state.apps.length),0,a);state.page=target;persist();renderHome();toast("已移动到第 "+(target+1)+" 页")}
function makeFolder(a,b){var aa=state.apps.find(function(x){return x.id===a}),bb=state.apps.find(function(x){return x.id===b});if(!aa||!bb)return;state.apps=state.apps.filter(function(x){return x.id!==a&&x.id!==b});state.folders.push({id:"folder-"+Date.now(),name:"新建文件夹",items:[aa,bb]});persist();renderHome();toast("文件夹已创建")}

function renderCharacter(){setHeader("韩俊 · 角色设置","CHAR PROFILE",true,"✓");view.innerHTML='<div class="page"><div class="card row"><button class="avatar" id="avatar">俊</button><div><b>点击头像更换</b><div class="sub">选择图片 / 拍摄 · 或图床上传</div></div></div><div class="section-title"><h3>城市与天气</h3><span>角色 / 用户</span></div><div class="card stack"><div class="row"><label class="field">角色城市<input id="cc" value="'+state.charCity+'"></label><label class="field">原型城市<input id="cp" value="'+state.charProto+'"></label><button class="btn light weather">获取</button></div><div class="row"><label class="field">用户城市<input id="uc" value="'+state.userCity+'"></label><label class="field">原型城市<input id="up" value="'+state.userProto+'"></label><button class="btn light weather">获取</button></div></div><div class="section-title"><h3>语音配置</h3><span>Voice API</span></div><div class="card stack"><label class="field">音色 ID<input placeholder="voice_kr_01"></label><label class="field">语速 <input type="range" id="speed" min=".5" max="2" step=".1" value="'+state.voiceSpeed+'"></label>'+toggleRow("根据 LLM 提供语气","关闭时由语音 API 按语境判断","tone",state.tone)+'<label class="field">语言<select id="lang">'+["自动","中文","한국어","日本語","English","Français"].map(function(x){return'<option '+(x===state.language?'selected':'')+'>'+x+'</option>'}).join("")+'</select></label><label class="field">情绪<select id="emotion">'+["自动","平静","开心","悲伤","害羞","生气","温柔","激动"].map(function(x){return'<option '+(x===state.emotion?'selected':'')+'>'+x+'</option>'}).join("")+'</select></label></div><div class="section-title"><h3>模型能力</h3></div><div class="card">'+toggleRow("角色识图","关闭后模型只读取图片附带的文字","recognize",state.recognize)+'</div></div>';action.onclick=saveChar;document.getElementById("avatar").onclick=function(){showUpload("更换角色头像")};view.querySelectorAll(".weather").forEach(function(x){x.onclick=function(){toast("已获取：小雨 · 17°C")}});bindToggles();function saveChar(){state.charCity=document.getElementById("cc").value;state.charProto=document.getElementB card" style="margin-top:8px">'+toggleRow("隐藏用户头像","连续消息仍保持气泡对齐","hideUserAvatar",state.hideUserAvatar)+'</div></div>';action.onclick=saveChat;bindToggles();view.querySelectorAll("[data-world]").forEach(function(x){x.onclick=function(){var i=state.worlds.indexOf(x.dataset.world);if(i<0)state.worlds.push(x.dataset.world);else state.worlds.splice(i,1);x.classList.toggle("on");persist()}});view.querySelectorAll("[data-bubble]").forEach(function(x){x.onclick=function(){state.bubble=x.dataset.bubble;persist();renderChatSettings()}});function saveChat(){state.bubbleColor=document.getElementById("bubblecolor").value;state.bubbleSize=document.getElementById("bubblesize").value;state.fontUrl=document.getElementById("fonturl").value;document.documentElement.style.setProperty("--user",state.bubbleColor);document.documentElement.style.setProperty("--bubble-size",state.bubbleSize+"px");persist();toast("聊天样式已保存")}}
